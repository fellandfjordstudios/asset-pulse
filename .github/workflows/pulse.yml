# THE PULSE'S DAILY RUN ON GITHUB, and the public catalog on GitHub Pages
# (the owner, 2026-10-03: "If we don't have a license issue, sure, go public").
#
# One job: sync the library to its main, the scorecard and the history row,
# every subject's sheet and close-up, the explorer's bake, the catalog; commit
# history.csv and the pin; deploy the catalog to Pages, with the scorecard's
# counts and read beside it at /scorecard.json. The private pulse page is built
# too and never deployed here; it reads that file.
#
# The catalog is deployed as a Pages ARTIFACT, never committed: this repository
# keeps no images and no generated geometry in git (CLAUDE.md). Every download
# carries ATTRIBUTION.txt from provenance and the library's licence texts
# (docs/press/licences/), and tools/catalog.py refuses to write a plate's bytes
# or a file over the Pages limit; a larger zip waits for R2.
#
# THE DERIVATION BACKLOG is the second job, `derive`, on its own runner and its
# own 350 minutes (tools/backlog.sh): it keeps what it finishes on this
# repository's `derive-results` branch, and the library pulls from there (its
# tools/derive-pull.sh; the owner, 2026-10-23). Nothing is pushed to the library.
#
# Needs one secret: LIBRARY_TOKEN, a fine-grained token that can READ
# codestiff/asset-generators and codestiff/asset-explorer (both private). The
# workflow's own token cannot. Without it the run stops at its first step and
# says so. Pages must be on with "GitHub Actions" as its source (Settings ->
# Pages); the deploy job fails with that message otherwise.
name: pulse

on:
  # EVERY EIGHT HOURS (the owner, 10-14: "Can we just use GitHub actions with
  # incremental updates? Maybe run every 8 hours?"): a run redoes only what
  # changed (the store below), so three a day cost little more than one.
  schedule:
    - cron: "37 */8 * * *"
  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: "Rebuild the customer site from cached renders and bakes at the committed pins (no new bake)"
        type: boolean
        default: false
      publish:
        description: "Publish the generated catalog to GitHub Pages (disable for artifact review)"
        type: boolean
        default: true
      backlog:
        description: "run the derivation backlog job (keeps its results on derive-results; nothing is pushed to the library)"
        default: "1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      date: ${{ steps.run.outputs.date }}
      catalog: ${{ steps.run.outputs.catalog }}
    steps:
      - id: pages
        uses: actions/configure-pages@v5
      - name: the library token
        env:
          LIBRARY_TOKEN: ${{ secrets.LIBRARY_TOKEN }}
        run: |
          if [ -z "$LIBRARY_TOKEN" ]; then
            echo "::error::stopped: no LIBRARY_TOKEN secret -- the library and the explorer are private, and this workflow's own token cannot read them. Add a fine-grained token with read access to codestiff/asset-generators and codestiff/asset-explorer as the repository secret LIBRARY_TOKEN."
            exit 1
          fi
          # Only the two private repositories this run reads: the checkout and
          # the push of this repository keep the workflow's own token.
          for r in asset-generators asset-explorer; do
            git config --global url."https://x-access-token:${LIBRARY_TOKEN}@github.com/codestiff/$r".insteadOf "https://github.com/codestiff/$r"
          done
      - uses: actions/checkout@v4
        id: checkout
      - name: Godot, a virtual display, Pillow, the library
        if: inputs.refresh_catalog != true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri >/dev/null
          bash .claude/hooks/session-start.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Catalog refresh dependencies
        if: inputs.refresh_catalog == true
        run: python3 -m pip install Pillow==12.3.0
      # THE PINS FIRST, so the caches below are keyed by them (row 215): an
      # unchanged library pin re-renders nothing, and an unchanged library and
      # explorer pin re-bakes nothing; a run cut short leaves its progress for
      # the next (each run saves under its own key; the newest for a pin is
      # restored).
      - name: the pins
        id: pins
        env:
          REFRESH_CATALOG: ${{ inputs.refresh_catalog }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ "$REFRESH_CATALOG" = "true" ]; then
            tools/sync-library.sh
          else
            tools/sync-library.sh --bump main
            # THE LIBRARY'S OWN GODOT AND MATHS RUNTIME, as the derive job's: the
            # store below is written only under the library's pinned runtime, and
            # every key carries the engine, so a run on transect's 4.5 would make
            # keys the library's own tools never read.
            ( cd library && GIT_CONFIG_GLOBAL="$RUNNER_TEMP/library-setup.gitconfig" tools/setup.sh )
          fi
          echo "library=$(sed -n 's/^commit=//p' library.lock)" >> "$GITHUB_OUTPUT"
          echo "explorer=$(sed -n 's/^commit=//p' explorer.lock)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # THE STORE (the library's plans/062 step 1): every bake and render keyed
      # by what it is made from, so a run redoes only the subjects whose key
      # moved, at any pin. Carried forward by a ROLLING key: each run saves its
      # own, and the newest is restored whatever the pins. It is the cook's one
      # write store (tools/bake.sh, the bake plan's step F): the cook's progress
      # across runs is the store, never a folder kept by the pin.
      # The path list is the one the retired ledger of tries saved with
      # (out/bake-ledger.json, now never written): actions/cache keys a cache by
      # its paths, so a new list would restore no store the runs before saved.
      - name: the store, as the last run left it
        if: inputs.refresh_catalog != true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/asset-generators/bakes
            out/bake-ledger.json
          key: store-${{ github.run_id }}
          restore-keys: store-
      - name: renders done at this library pin
        id: renders
        uses: actions/cache/restore@v4
        with:
          path: out/render-cache
          key: renders-${{ steps.pins.outputs.library }}-${{ github.run_id }}
          restore-keys: renders-${{ steps.pins.outputs.library }}-
      # EACH SUBJECT'S LAST GOOD BUILD (out/catalog-last-good, the bake plan's
      # step E), ROLLING as the store: served marked with its pin when this
      # run's cook does not finish that subject.
      # Its path list, and the bake- prefix after its own, are the retired
      # pin-keyed bake cache's, which carried the last good builds until now: a
      # new list would restore none of them. tools/bake.sh empties the other two.
      - name: the last good build of each subject
        uses: actions/cache/restore@v4
        with:
          path: |
            out/bake-resume
            library/build/artifacts
            out/catalog-last-good
          key: last-good-${{ github.run_id }}
          restore-keys: |
            last-good-
            bake-
      # A REFRESH ONLY (no cook): the cook's output at these pins, as the last
      # run at them wrote it. A normal run never restores it; the store above
      # is what carries a cook's progress.
      - name: the cooked catalog at these pins (a refresh)
        id: bake
        if: inputs.refresh_catalog == true
        uses: actions/cache/restore@v4
        with:
          path: |
            out/cooked
            library/build/artifacts
          key: cooked-${{ steps.pins.outputs.library }}-${{ steps.pins.outputs.explorer }}-${{ github.run_id }}
          restore-keys: cooked-${{ steps.pins.outputs.library }}-${{ steps.pins.outputs.explorer }}-
      - name: the catalog guard's test
        run: python3 tools/test_catalog_guard.py
      - name: Require matching cached inputs for a catalog refresh
        if: inputs.refresh_catalog == true
        env:
          RENDER_CACHE: ${{ steps.renders.outputs.cache-matched-key }}
          BAKE_CACHE: ${{ steps.bake.outputs.cache-matched-key }}
          LIBRARY_PIN: ${{ steps.pins.outputs.library }}
          EXPLORER_PIN: ${{ steps.pins.outputs.explorer }}
        run: |
          test -n "$RENDER_CACHE" && test -n "$BAKE_CACHE" || { echo "::error::No cached outputs at these pins. Run a normal pulse first."; exit 1; }
          test "$(cat out/render-cache/render-pin)" = "$LIBRARY_PIN"
          test -f out/cooked/catalog/manifest.json
      - name: the run
        id: run
        env:
          # The backlog is the derive job's, below, on its own runner.
          PULSE_BACKLOG: "0"
          PULSE_TRANSFER: "0"
          # Public settings, not Worker secrets. Missing values disable sending
          # with an explanation while the catalog continues to publish.
          CATALOG_INTAKE_URL: ${{ vars.CATALOG_INTAKE_URL }}
          EDGE_ZONE: ${{ vars.EDGE_ZONE }}
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          ITCH_URL: ${{ vars.ITCH_URL }}
          REFRESH_CATALOG: ${{ inputs.refresh_catalog }}
          # Renders done at this pin are not drawn again.
          PULSE_RESUME: "1"
          # THE COOK'S DEADLINE (the library's tools/cook.sh --deadline, plans/107
          # step 9): 45 minutes from its start. Only items whose recorded cost
          # fits what remains are begun, under fits+shuffle:<run number>; the
          # rest are deferred by name and the store keeps what finished, so the
          # next run bakes only those and what moved.
          PULSE_BAKE_BUDGET_S: "2700"
          # THE LIMIT PER ITEM (--item-limit, --item-floor): an item past 3 times
          # its recorded cost, or 600 s, is stopped, put back once and failed by
          # name on a second overrun (five runs, 10-23 to 10-25, each spent its
          # budget on one subject; built-oar takes 815 s alone, a cost for its
          # generator to fix, the bake plan's step D).
          PULSE_BAKE_ITEM_LIMIT: "3"
          PULSE_BAKE_SUBJECT_CAP_S: "600"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          DATE="${{ steps.pins.outputs.date }}"
          if [ -f out/render-cache/render-pin ]; then mkdir -p "out/$DATE" && cp -a out/render-cache/. "out/$DATE/"; fi
          if [ "$REFRESH_CATALOG" = "true" ]; then
            python3 tools/catalog.py "out/$DATE"
          else
            ./run.sh
          fi
          code=$?
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # OPTION A (the owner, 2026-10-10): the public catalog is replaced only by
          # one listing at least as many subjects; a run whose bake was cut short
          # leaves the live page as it was (tools/catalog_guard.py, its test above).
          # A skipped publish is a WARNING on the run, naming what is missing
          # (row 555): the run is green and deploy skipped either way.
          if [ ! -f "out/$DATE/catalog/index.html" ]; then
            echo "::warning title=publish skipped::no catalog this run (the bake or the catalog failed; see this step's log)"
          elif guard="$(python3 tools/catalog_guard.py "out/$DATE/catalog" "${{ steps.pages.outputs.base_url }}/" 2>&1)"; then
            echo "$guard"
            echo "catalog=out/$DATE/catalog" >> "$GITHUB_OUTPUT"
          else
            echo "$guard"
            echo "::warning title=publish skipped::$(echo "$guard" | tail -1)"
            { echo "### publish skipped"; echo; echo "$guard"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          grep -h "^catalog: " "out/$DATE"/*.log 2>/dev/null | tail -3 || true
          exit $code
      # THE SCORECARD, PUBLIC (the library's row 658; the owner, 10-29): the
      # library scorecard's --json and its --read, as one file served beside
      # the catalog at /scorecard.json, where the private pulse page reads it;
      # counts and the read only, no image, no geometry. The totals and the read
      # go on this run's page too (the job summary), deployed or not.
      # A failure here is named on the run and stops nothing after it.
      - name: the scorecard, public
        if: always() && steps.pins.outcome == 'success'
        continue-on-error: true
        env:
          CATALOG: ${{ steps.run.outputs.catalog }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          set -o pipefail
          DATE="${{ steps.pins.outputs.date }}"
          URL=""
          [ -n "$CATALOG" ] && [ "$PUBLISH" = "true" ] && URL="${{ steps.pages.outputs.base_url }}/scorecard.json"
          python3 tools/scorecard_public.py "out/$DATE" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$URL" | tee -a "$GITHUB_STEP_SUMMARY"
      # Even when the run was cut short: every subject finished so far, with
      # its status, for the next run at the same pin.
      - name: what this run rendered
        if: always() && steps.pins.outcome == 'success' && inputs.refresh_catalog != true
        run: |
          DATE="${{ steps.pins.outputs.date }}"
          rm -rf out/render-cache && mkdir -p out/render-cache
          cp "out/$DATE/render-pin" out/render-cache/ 2>/dev/null || true
          for d in "out/$DATE"/*/; do [ -f "$d/status" ] && cp -a "$d" out/render-cache/; done
          echo "$(ls out/render-cache | wc -l) entries kept"
      - name: save the renders for this pin
        if: always() && steps.pins.outcome == 'success' && inputs.refresh_catalog != true
        uses: actions/cache/save@v4
        with:
          path: out/render-cache
          key: renders-${{ steps.pins.outputs.library }}-${{ github.run_id }}
      - name: the store, under the cache's limit
        if: always() && steps.pins.outcome == 'success' && inputs.refresh_catalog != true
        run: python3 tools/store-prune.py ~/.cache/asset-generators/bakes
      - name: save the store for the next run
        if: always() && steps.pins.outcome == 'success' && inputs.refresh_catalog != true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/asset-generators/bakes
            out/bake-ledger.json
          key: store-${{ github.run_id }}
      - name: save the last good builds
        if: always() && steps.pins.outcome == 'success' && inputs.refresh_catalog != true
        uses: actions/cache/save@v4
        with:
          path: |
            out/bake-resume
            library/build/artifacts
            out/catalog-last-good
          key: last-good-${{ github.run_id }}
      - name: save the cooked catalog for a refresh at these pins
        if: always() && steps.pins.outcome == 'success' && inputs.refresh_catalog != true && hashFiles('out/cooked/catalog/manifest.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            out/cooked
            library/build/artifacts
          key: cooked-${{ steps.pins.outputs.library }}-${{ steps.pins.outputs.explorer }}-${{ github.run_id }}
      - name: commit the day's row and the pin
        if: always() && steps.checkout.outcome == 'success' && inputs.refresh_catalog != true
        run: |
          git config user.name "Fell & Fjord"
          git config user.email "fellandfjord@gmail.com"
          git add history.csv library.lock
          git diff --cached --quiet && exit 0
          git commit -q -m "pulse $(date -u +%Y-%m-%d) (GitHub Actions)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: the catalog, without the private page
        if: steps.run.outputs.catalog != ''
        run: |
          mkdir -p _pages && cp -r "${{ steps.run.outputs.catalog }}/." _pages/
          rm -f _pages/objects.json
          cp "out/${{ steps.pins.outputs.date }}/public/scorecard.json" _pages/ 2>/dev/null || echo "no scorecard.json this run"
          du -sh _pages
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.catalog != ''
        with:
          path: _pages

  # THE DERIVATION BACKLOG, KEPT HERE (tools/backlog.sh). Its checkpoints -- the
  # bench's rows and each record's parts, keyed inside by the deriver's and each
  # generator's fingerprints -- are kept in actions/cache, so a backlog longer
  # than one runner stops at its budget and the next run resumes; what each run
  # finishes is kept on derive-results, and laid over library/ by the next.
  derive:
    if: inputs.refresh_catalog != true && (github.event_name == 'schedule' || inputs.backlog == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: derive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: the library token
        env:
          LIBRARY_TOKEN: ${{ secrets.LIBRARY_TOKEN }}
        run: |
          if [ -z "$LIBRARY_TOKEN" ]; then
            echo "::error::stopped: no LIBRARY_TOKEN secret (read access to the library library.lock names)"
            exit 1
          fi
          REPO="$(sed -n 's/^repo=//p' library.lock)"
          git config --global url."https://x-access-token:${LIBRARY_TOKEN}@github.com/$REPO".insteadOf "https://github.com/$REPO"
      - name: the library at its main, on the library's own Godot
        id: pins
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri >/dev/null
          bash .claude/hooks/session-start.sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          tools/sync-library.sh --bump main
          # THE LIBRARY'S PIN, NOT TRANSECT'S: what is derived here is the
          # library's, so it is made by the Godot and runtime the library's own
          # setup provisions (run 13 derived under 4.5, and the library, on
          # 4.7.2, took none of it). Its git settings go to a scratch file: the
          # results are this repository's to push, as asset-pulse.
          ( cd library && GIT_CONFIG_GLOBAL="$RUNNER_TEMP/library-setup.gitconfig" tools/setup.sh )
          echo "library=$(sed -n 's/^commit=//p' library.lock)" >> "$GITHUB_OUTPUT"
          echo "godot=$(godot --headless --version | tail -1)" >> "$GITHUB_OUTPUT"
      - name: the checkpoints so far
        uses: actions/cache/restore@v4
        with:
          path: |
            library/.git/ag-logs/derive-checkpoints
            library/.git/ag-logs/derive-parts
          key: derive-${{ steps.pins.outputs.godot }}-${{ steps.pins.outputs.library }}-${{ github.run_id }}
          restore-keys: |
            derive-${{ steps.pins.outputs.godot }}-${{ steps.pins.outputs.library }}-
            derive-${{ steps.pins.outputs.godot }}-
      - name: the backlog
        env:
          PULSE_BACKLOG_BUDGET_S: "18600"
        run: |
          git config user.name "Fell & Fjord"
          git config user.email "fellandfjord@gmail.com"
          tools/backlog.sh
      - name: save the checkpoints
        if: always() && steps.pins.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            library/.git/ag-logs/derive-checkpoints
            library/.git/ag-logs/derive-parts
          key: derive-${{ steps.pins.outputs.godot }}-${{ steps.pins.outputs.library }}-${{ github.run_id }}

  deploy:
    needs: run
    if: needs.run.outputs.catalog != '' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
